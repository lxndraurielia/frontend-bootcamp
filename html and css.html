<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html and Css styling</title>
<style>
    body { 
        background-color: lightblue;
    }

    h1 {
        color: white;
        text-align: center;
    }

    p.black {
        font-family:verdana;
        font-size: 20px;
        color: black;
        text-align: center;
    }

    p.red {
        text-align: center;
        color: red;
    }

    #paragraph1 {
        text-align: center;
        color: black;
    }
</style>
</head>
<body>
    <h1>My First CSS Example</h1>
        <p class="black">This is a paragraph</p>
        <p class="red" title="class selector">This is a second paragraph</p>
        <p id="paragraph1" title="this is id selesctor">Hello World!</p>
        <p>This paragraph is not affected by the style.</p>
</body>
